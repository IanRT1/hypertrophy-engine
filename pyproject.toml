[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hypertrophy-engine"
version = "0.1.0"
description = "A desktop hypertrophy training simulation built with PySide6."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = ["main", "session"]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "ui*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
